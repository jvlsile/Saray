:root{--champ:#f2d9a6;--blush:#f6b3c8;--ink:#fff7f0;--ease:cubic-bezier(.23,1,.32,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#12030b;overflow:hidden;color:var(--ink);font-family:Fraunces,Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;z-index:2;pointer-events:none;opacity:0;transform:translateY(14px);filter:blur(8px);
  transition:opacity .9s var(--ease),transform 1.2s var(--ease),filter .9s var(--ease)}
.ov.on{opacity:1;transform:none;filter:none}
#ovTitle{left:0;right:0;bottom:15vh;text-align:center;font-style:italic;font-weight:400;font-size:clamp(18px,2.4vw,30px);color:var(--blush);letter-spacing:.01em;text-shadow:0 2px 30px #000}
#ovCount{left:0;right:0;bottom:7vh;display:flex;flex-direction:column;align-items:center;gap:10px;text-shadow:0 2px 24px #000}
.hms{display:flex;align-items:baseline;gap:clamp(14px,3vw,34px);font-weight:300;font-variant-numeric:tabular-nums}
.hms b{font-weight:300;font-size:clamp(34px,5.4vw,64px);color:var(--ink)}
.hms i{font-style:italic;font-size:clamp(14px,1.5vw,18px);color:var(--champ);margin-left:6px}
#fecha{font-weight:600;font-size:clamp(22px,2.6vw,34px);color:var(--champ)}
#tbd{font-style:italic;font-size:clamp(15px,1.6vw,20px);color:var(--blush)}
[hidden]{display:none!important}
#ovGuardar{left:0;right:0;bottom:2.6vh;display:flex;justify-content:center}
#ovGuardar.on{pointer-events:auto}
#bGuardar{font:600 clamp(16px,1.7vw,19px) Fraunces,serif;color:#2b0a1a;background:linear-gradient(180deg,#f8e6bf,#e0bd7e);border:0;border-radius:999px;padding:14px 30px;cursor:pointer;
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .16s ease-out}
#bGuardar:active{transform:scale(.97)}
#bGuardar:focus-visible{outline:2px solid var(--champ);outline-offset:4px}
#ovTend{left:0;right:0;bottom:4.5vh;text-align:center;text-shadow:0 2px 20px #000;padding:0 20px}
#tendCount{font-weight:600;font-size:clamp(22px,2.6vw,32px);color:var(--champ)}
#ovTend p+p{font-style:italic;font-size:clamp(14px,1.5vw,18px);color:var(--blush);margin-top:4px}
#polaroid{left:50%;bottom:14vh;width:min(36vw,46vh,300px);background:#fbf8f3;padding:12px 12px 46px;box-shadow:0 30px 70px rgba(0,0,0,.55);cursor:pointer;filter:none;
  transform:translate(-50%,-75vh) rotate(-24deg);opacity:1;transition:transform 1.25s cubic-bezier(.2,1.25,.35,1),opacity .4s ease}
#polaroid:not(.on){opacity:0;transform:translate(-50%,-75vh) rotate(-24deg);transition:transform .5s cubic-bezier(.5,0,.75,0),opacity .4s ease .1s}
#polaroid.on{transform:translate(-50%,0) rotate(-4deg);pointer-events:auto}
#polaroid.on.aside{transform:translate(calc(-50% + min(34vw,520px)),6vh) rotate(9deg) scale(.62)}
#polaroid .pic{aspect-ratio:1;background:#222;overflow:hidden}
#polaroid img,#polaroid video{width:100%;height:100%;object-fit:cover;display:block}
#polaroid .tape{position:absolute;left:50%;top:-14px;width:96px;height:30px;transform:translateX(-50%) rotate(3deg);background:rgba(246,179,200,.75);box-shadow:0 2px 6px rgba(0,0,0,.15)}
#polaroid .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-style:italic;color:#4a0f27;font-size:clamp(15px,1.6vw,19px)}
@media (max-aspect-ratio:1/1){#polaroid{width:min(64vw,40vh,300px);bottom:16vh}#polaroid.on.aside{transform:translate(-50%,46vh) rotate(6deg) scale(.5)}}
#musicChip{left:50%;top:16px;transform:translate(-50%,-10px);display:flex;align-items:center;gap:10px;background:rgba(18,3,11,.7);border:1px solid rgba(242,217,166,.3);
  backdrop-filter:blur(8px);padding:8px 16px;border-radius:999px;font-size:14px;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#musicChip.on{transform:translate(-50%,0)}
#musicChip b{font-weight:600;color:var(--champ)}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:var(--blush);animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#soundGate{left:50%;bottom:22vh;transform:translate(-50%,10px);font:600 16px Fraunces,serif;color:#2b0a1a;background:linear-gradient(180deg,#f8e6bf,#e0bd7e);border:0;border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#soundGate.on{transform:translate(-50%,0);pointer-events:auto}
#toast{left:50%;top:7vh;transform:translate(-50%,-10px);background:rgba(18,3,11,.78);border:1px solid rgba(242,217,166,.3);backdrop-filter:blur(8px);
  padding:12px 20px;border-radius:14px;font-size:clamp(14px,1.5vw,17px);max-width:min(90vw,460px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#fecha::first-letter{text-transform:uppercase}
#ui{position:fixed;right:14px;top:14px;z-index:3;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100vw - 28px);opacity:0;pointer-events:none;transition:opacity .4s ease}
#ui.on{opacity:1;pointer-events:auto}
#ui button{font:400 14px Fraunces,serif;color:var(--ink);background:rgba(18,3,11,.55);border:1px solid rgba(242,217,166,.28);
  padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .16s ease-out,background .2s ease}
#ui button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#ui button:hover{background:rgba(242,217,166,.16)}}
#ui button:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#4a1029 0%,#2b0a1a 40%,#12030b 100%);transition:opacity 1.1s cubic-bezier(.23,1,.32,1),filter 1.1s ease}
#gate.off{opacity:0;filter:blur(10px);pointer-events:none}
#gate p{font-style:italic;font-size:clamp(17px,2vw,22px);color:var(--blush)}
#gate h1{font-weight:600;font-size:clamp(46px,8vw,104px);line-height:1;color:var(--champ);margin-top:-14px;letter-spacing:-.01em}
#gate .row{display:flex;flex-direction:column;align-items:center;gap:12px}
#gStart{font:600 clamp(17px,1.8vw,20px) Fraunces,serif;color:#2b0a1a;background:linear-gradient(180deg,#f8e6bf,#e0bd7e);border:0;border-radius:999px;
  padding:16px 34px;cursor:pointer;box-shadow:0 10px 40px rgba(242,217,166,.25),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .16s ease-out}
#gStart:active{transform:scale(.97)}
#gSilent{font:400 15px Fraunces,serif;color:var(--ink);opacity:.7;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
#gate button:focus-visible{outline:2px solid var(--champ);outline-offset:4px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="gate"><p>La despedida de</p><h1>Saray</h1><div class="row"><button id="gStart">Empezar con música</button><button id="gSilent">Ver sin sonido</button></div></div>
<div class="ov" id="ovTitle">Su última noche de soltera</div>
<div class="ov" id="ovCount">
  <div id="fecha"></div>
  <div class="hms" id="hms" hidden><span><b id="hh">00</b><i>h</i></span><span><b id="mm">00</b><i>min</i></span><span><b id="ss">00</b><i>s</i></span></div>
  <div id="tbd">Hora por confirmar</div>
</div>
<div class="ov" id="ovGuardar"><button id="bGuardar">Guardar la carta</button></div>
<div class="ov" id="ovTend"><p id="tendCount"></p><p id="tendHint">Toca una carta para volver a leerla</p></div>
<div class="ov" id="polaroid" role="button" tabindex="0" aria-label="Foto de la carta: toca para apartarla">
  <span class="tape"></span><div class="pic"><img id="polImg" alt="" hidden><video id="polVideo" playsinline loop hidden></video></div><span class="cap">Para Saray</span>
</div>
<div class="ov" id="musicChip"><span class="bars"><i></i><i></i><i></i></span><span>Suena <b id="musicName"></b></span></div>
<div class="ov" id="toast"></div>
<button class="ov" id="soundGate">Toca para activar la música</button>
<div id="ui"><button id="bPause">Pausar</button><button id="bSound">Silenciar</button><button id="bReplay">Repetir</button><button id="bCarta">Ver la carta</button><button id="bFull">Pantalla completa</button></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
